<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Human Design Chart</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef3f3;
    font-family: Arial, Helvetica, sans-serif;
    padding: 16px;
  }
  .chart {
    display: grid;
    grid-template-columns: minmax(84px, 130px) 1fr minmax(84px, 130px);
    gap: 12px;
    align-items: start;
    background: #ffffff;
    border-radius: 8px;
    padding: 20px 16px;
    max-width: 920px;
    width: 100%;
    box-shadow: 0 8px 28px rgba(0,0,0,.08);
  }
  .scale-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    font-size: 12px;
    color: #666;
    width: 100%;
  }
  .scale-control input[type="range"] {
    width: min(240px, 60%);
    accent-color: #008b8b;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
    height: 24px;
    background: transparent;
  }
  .scale-control input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    background: #ccc;
    border-radius: 2px;
  }
  .scale-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border-radius: 50%;
    background: #008b8b;
    cursor: pointer;
  }
  .scale-control input[type="range"]::-moz-range-track {
    height: 4px;
    background: #ccc;
    border-radius: 2px;
  }
  .scale-control input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border: none;
    border-radius: 50%;
    background: #008b8b;
    cursor: pointer;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: .03em;
  }
  .design h2 { color: #008b8b; }
  .personality h2 { color: #292f33; text-align: right; }
  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 3px;
    font-size: clamp(10px, 2.4vw, 13px);
    margin-bottom: 3px;
    color: #fff;
    white-space: nowrap;
  }
  .design .row { background: #008b8b; }
  .personality .row {
    background: #292f33;
    flex-direction: row-reverse;
  }
  .planet {
    font-size: 14px;
    width: 16px;
    text-align: center;
  }
  .body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  /* ===== Variable arrows (beside head, like classic charts) ===== */
  .variables-bar {
    position: absolute;
    top: 4%;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    padding: 0 2%;
    max-width: calc(var(--bg-scale, 1) * 480px);
    width: 100%;
    margin: 0 auto;
  }
  .variables-bar.empty { display: none; }
  .variables-bar .var-side {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .variables-bar .var-side.design { align-items: flex-start; }
  .variables-bar .var-side.personality { align-items: flex-end; }
  .variables-bar .var-arrow {
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    color: #7b8a9a; /* soft slate-blue like the reference */
    text-shadow: 0 0 2px #fff;
  }
  @media (max-width: 640px) {
    .variables-bar { top: 3%; padding: 0 1%; }
    .variables-bar .var-arrow { font-size: 14px; }
    .variables-bar .var-side { gap: 4px; }
  }

  .body svg {
    width: 100%;
    max-width: calc(var(--bg-scale, 1) * 480px);
    height: auto;
    transition: max-width .15s ease;
  }
  .footer {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 10px;
    color: #999;
    margin-top: 6px;
  }
  #scaleOuter {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  #scaleWrapper {
    width: 100%;
    max-width: 920px;
  }

  /* ===== Mobile optimization =====
     Same layout/order as desktop — Design | Bodygraph | Personality —
     just narrower pill columns so the bodygraph gets more room. */
  @media (max-width: 640px) {
    body { padding: 6px; }
    .chart {
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
    }
    .panel { min-width: 0; }
    .panel h2 { font-size: 8px; margin-bottom: 4px; letter-spacing: .04em; }
    .row {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 3px 2px;
      font-size: 7px;
      margin-bottom: 2px;
      border-radius: 5px;
      line-height: 1.05;
      white-space: normal;
      word-break: break-word;
      min-width: 0;
    }
    .personality .row { flex-direction: column; }
    .planet { font-size: 9px; width: auto; line-height: 1; }
    .body { min-width: 0; }
    .scale-control { margin-top: 6px; gap: 6px; font-size: 10px; }
    .scale-control input[type="range"] {
      width: min(160px, 55%);
      height: 28px; /* keep tap target generous even at small width */
    }
    .footer { font-size: 8px; margin-top: 4px; }
  }

  /* ===== Detail-layer design tokens (themeable in one place) ===== */
  :root {
    --color-center-defined: #008b8b;
    --color-center-undefined: #ffffff;
    --color-personality: #292f33;
    --color-design: #008b8b;
    --color-mixed-personality: #292f33;
    --color-mixed-design: #008b8b;
    --color-channel-open: #e4e9ea;
    --color-channel-border: #292f33;
    --color-gate-inactive: #5c6870;
    --color-gate-defined-ring: #008b8b;
    --color-text-primary: #292f33;
    --color-text-secondary: #5c6870;
  }

  /* ===== Tooltip ===== */
  #hd-tooltip {
    position: fixed; z-index: 60; max-width: 270px;
    background: #fff; border: 1px solid #d7ddde; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 8px 10px;
    font-size: 12px; line-height: 1.45; color: var(--color-text-primary);
    pointer-events: none;
  }
  #hd-tooltip .tt-title { font-weight: 700; margin-bottom: 3px; }
  #hd-tooltip .tt-meta { color: var(--color-text-secondary); }
  #hd-tooltip .tt-layer {
    display: inline-block; min-width: 14px; text-align: center;
    padding: 0 4px; border-radius: 3px; font-size: 9px; font-weight: 700;
    color: #fff; margin-right: 3px;
  }
  #hd-tooltip .tt-layer.p { background: var(--color-personality); }
  #hd-tooltip .tt-layer.d { background: var(--color-design); }
  #hd-tooltip .tt-layer.b { background: linear-gradient(45deg, var(--color-personality) 50%, var(--color-design) 50%); }
  #hd-tooltip .tt-layer.o { background: #9aa4a8; }

  /* ===== Side-column row states ===== */
  .row[data-gate] { cursor: pointer; }
  .row.hl { box-shadow: inset 0 0 0 2px #ffffff, inset 0 0 0 4px var(--color-gate-defined-ring); }
  /* ===== Mode toggle (optional, config.showModeToggle) ===== */
  #modeToggle {
    position: fixed; right: 12px; bottom: 12px; z-index: 50;
    border: 1px solid #d7ddde; background: #ffffff; color: var(--color-text-primary);
    font: 600 12px Arial, Helvetica, sans-serif; padding: 6px 12px; border-radius: 999px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.10);
  }
  #modeToggle:hover { border-color: var(--color-design); }
</style>
<base target="_blank">

<div class="chart">
  <!-- DESIGN (left) - populated dynamically from chart data -->
  <aside class="panel design">
    <h2>Design</h2>
    <div id="design-list"><div class="row" style="background:#ccc;">Loading…</div></div>
  </aside>

  <!-- BODYGRAPH (center) -->
  <div class="body">
    <div class="variables-bar empty" id="variables-bar" aria-label="Variables">
      <div class="var-side design">
        <div class="var-arrow" id="var-determination" aria-label="Determination"></div>
        <div class="var-arrow" id="var-environment" aria-label="Environment"></div>
      </div>
      <div class="var-side personality">
        <div class="var-arrow" id="var-motivation" aria-label="Motivation"></div>
        <div class="var-arrow" id="var-perspective" aria-label="Perspective"></div>
      </div>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" id="chart" viewBox="0 0 852 1310" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" preserveAspectRatio="xMidYMid meet"><defs><style><![CDATA[
:root{
  --profile:#cfe4e4;

  /* ===== BRAND PALETTE ===== */
  --slate:#292f33;
  --teal:#008b8b;
  --white:#ffffff;

  /* Inactive/potential channel: charcoal at reduced opacity, per spec */
  --inactive-channel: rgba(41,47,51,0.18);

  /* ===== PER-CENTER PALETTE -----------------------------------------
     Nine distinct fills, every one a tint/shade/blend of the two brand
     colors (#292F33 slate, #008B8B teal) rather than an outside hue.
     Teal family lightens toward the Head/Mind centers; slate family
     deepens toward the Root/body centers; Ego sits as a warm midpoint
     blend between the two. Swap any value below to retune the palette -
     nothing else in the file needs to change. */
  --center-head:         #66c2c2; /* light teal   */
  --center-ajna:         #00b3b3; /* bright teal  */
  --center-throat:       #008b8b; /* brand teal   */
  --center-g:            #007575; /* deep teal    */
  --center-ego:          #4d6163; /* teal-slate blend */
  --center-sacral:       #005f5f; /* dark teal    */
  --center-solarplexus:  #3d4548; /* light slate  */
  --center-spleen:       #292f33; /* brand slate  */
  --center-root:         #181c1f; /* deep slate   */

  --f:Sora,system-ui,sans-serif;
}
.profile{fill:var(--profile)}

/* ---- CENTERS: each defined center gets its own colour, driven by the
   --center-fill custom property set per-group from JS (falls back to
   brand teal if a group is somehow left unset). Undefined centers stay
   white-fill / slate-outline exactly as before. ---- */
.c > path:first-of-type{ fill: var(--white); }
.c > path:last-of-type{ fill: var(--slate); }
.c.defined > path:first-of-type{ fill: var(--center-fill, var(--teal)); }
.c.defined > path:last-of-type{ fill: var(--center-fill, var(--teal)); }

/* ---- GATE CIRCLES ----
   Non-activated (default): white fill, charcoal 1px outline, charcoal text.
   Activated = part of a fully defined channel: teal fill, no outline,
   white text. (Membership in a defined channel - not mere activation -
   is what "activated gate" means per spec, so a hanging/solo-activated
   gate that never completes a channel renders as non-activated here.) */
.gtbg{ fill: var(--white); stroke: var(--slate); stroke-width: 1px; }
.gtbg.gate-active{ fill: var(--teal); stroke: none; }
text{ fill: var(--slate); font-family: var(--f); font-weight: 800; font-size: 18px; }
text.gate-active{ fill: var(--white); }

/* ---- CHANNELS ----
   Default state = inactive/potential: thin, low-opacity charcoal so it
   recedes visually. The .go paths are the hairline structural outlines
   between wedges and stay charcoal at full opacity regardless of state,
   giving every channel a crisp edge even when its fill is faint. */
.ga,.gb{ fill: var(--inactive-channel); }
.go{ fill:none; stroke:var(--slate); stroke-miterlimit:10; }

/* Personality-only activation: solid charcoal (was traditionally black) */
.channel-personality{ fill: var(--slate); }

/* Design-only activation: solid teal (was traditionally red) */
.channel-design{ fill: var(--teal); }

/* Both Personality AND Design activated: alternating charcoal/teal
   stripe pattern (was traditionally a red/black stripe). Channels here
   are filled wedge polygons rather than stroked lines, so a literal
   stroke dasharray can't apply - #channelBothPattern (defined below)
   reproduces the same "6px/6px alternating" read as a tiled fill. */
.channel-both{ fill: url(#channelBothPattern); }

#Integration10-20-a,#Integration10-20-b,#Integration10-20-outline,#Integration34-57-a,#Integration34-57-b,#Integration34-57-outline,#Integration10-57-a,#Integration10-57-b,#Integration10-57-outline,#Integration10-34-a,#Integration10-34-b,#Integration10-34-outline,#Integration20-34-a,#Integration20-34-b,#Integration20-34-outline{display:none}
#Integration20-57-outline,#Integration10-57-outline,#Integration10-34-outline,#Integration20-34-outline{fill:var(--slate)}
#Integration10-20-outline,#Integration34-57-outline{fill:none;stroke:var(--slate)}

/* ---- DETAIL LAYER: channel halves (one independently styled half per gate) ---- */
.ga.half-personality,.gb.half-personality{ fill: var(--color-personality); }
.ga.half-design,.gb.half-design{ fill: var(--color-design); }
.ga.half-both,.gb.half-both{ fill: url(#channelBothPattern); }
.ga.half-open,.gb.half-open{ fill: var(--color-channel-open); }

/* ---- DETAIL LAYER: gate activation states ---- */
.gtbg.gate-p{ fill: var(--color-personality); stroke: none; }
.gtbg.gate-d{ fill: var(--color-design); stroke: none; }
.gtbg.gate-both{ fill: url(#channelBothPattern); stroke: none; }
text.gate-p,text.gate-d,text.gate-both{ fill: #ffffff; }
.gtbg:focus{ outline: none; }

/* ---- DETAIL LAYER: centre definition source (border cue on the outline path) ---- */
/* Definition-source cue: coloured stroke on the outline path so the
   per-center fill remains visible. Turn off via CONFIG.showCenterDefinitionSource */
#Centers .c.src-p > path:last-of-type{ stroke: var(--color-personality); stroke-width: 4px; }
#Centers .c.src-d > path:last-of-type{ stroke: var(--color-design); stroke-width: 4px; }
#Centers .c.src-m > path:last-of-type{ stroke: #008b8b; stroke-width: 4px; stroke-dasharray: 6 4; }

/* ---- Highlight + high contrast (never colour-only: ring + glow) ---- */
#chart .hl{ filter: drop-shadow(0 0 3px rgba(0,139,139,.95)); }
.gtbg.hl{ stroke: var(--color-gate-defined-ring); stroke-width: 2.5px; }
#chart.hc .go{ stroke-width: 2.2px; }
#chart.hc .gtbg{ stroke-width: 2px; }
#chart.hc .c > path:last-of-type{ stroke: none; }
]]></style>
<pattern id="channelBothPattern" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
  <rect width="12" height="12" fill="#008b8b"/>
  <rect width="6" height="12" fill="#292f33"/>
</pattern>

<div id="hd-tooltip" role="tooltip" hidden></div>
<button id="modeToggle" type="button" hidden>Mode: Detailed</button>

<script>
  // ---------- Existing zoom slider ----------
  const slider = document.getElementById('scaleSlider');
  const chartWrap = document.querySelector('.chart');
  slider.addEventListener('input', () => {
    chartWrap.style.setProperty('--bg-scale', slider.value / 100);
  });

  // ================= Theme / behaviour configuration (props) =================
  // Can be preset before load via window.BODYGRAPH_CONFIG, or overridden per
  // render via postMessage({ type:'renderBodygraph', chart, config }) /
  // postMessage({ type:'setBodygraphConfig', config }).
  const CONFIG = Object.assign({
    mode: 'detailed',              // 'detailed' | 'simplified' (simplified = original single-teal render)
    showDetailedActivations: true, // master switch for the detail layer
    showHangingGates: true,        // colour the active half of a partial channel
    showChannelLayerColours: true, // false => active halves fall back to brand teal
    showCenterDefinitionSource: false, // set true to show P/D/mixed stroke cue on defined centres
    highContrastMode: false,       // thicker strokes for accessibility
    showModeToggle: false          // on-screen Detailed/Simplified switch
  }, window.BODYGRAPH_CONFIG || {});
  let lastChart = null;

  // ================= Static structure (chart-independent geometry data) =================
  // The 36 fixed Human Design channels as [gateA, gateB] endpoint pairs.
  const CHANNELS = [
    [64,47],[61,24],[63,4],[17,62],[43,23],[11,56],   // Head/Ajna <-> Ajna/Throat
    [13,33],[1,8],[7,31],                            // G <-> Throat
    [2,14],[15,5],[46,29],                           // G <-> Sacral
    [53,42],[60,3],[52,9],[19,49],[39,55],[41,30],   // Root <-> Sacral / Solar Plexus
    [58,18],[38,28],[54,32],                         // Root <-> Spleen
    [16,48],[20,57],[26,44],[21,45],[35,36],[12,22], // Throat <-> Spleen/Ego/Solar Plexus
    [51,25],[40,37],[6,59],[27,50],                  // Ego/Solar Plexus <-> G/Root/Sacral/Spleen
    [10,20],[10,34],[10,57],[20,34],[20,57],[34,57]  // Integration
  ];
  function channelKeyOf(a, b){ return [a, b].sort((x, y) => x - y).join('-'); }

  // Fixed gate -> centre membership (geometry of the chart, not person data).
  const GATE_CENTER = {
    64:'Head',61:'Head',63:'Head',
    47:'Ajna',24:'Ajna',4:'Ajna',17:'Ajna',11:'Ajna',43:'Ajna',
    62:'Throat',23:'Throat',56:'Throat',35:'Throat',12:'Throat',45:'Throat',
    16:'Throat',20:'Throat',8:'Throat',33:'Throat',31:'Throat',
    13:'G',1:'G',7:'G',2:'G',46:'G',15:'G',10:'G',25:'G',
    14:'Sacral',29:'Sacral',59:'Sacral',9:'Sacral',3:'Sacral',5:'Sacral',
    27:'Sacral',34:'Sacral',42:'Sacral',
    48:'Spleen',57:'Spleen',44:'Spleen',50:'Spleen',32:'Spleen',28:'Spleen',18:'Spleen',
    21:'Ego',26:'Ego',40:'Ego',51:'Ego',
    36:'Solar Plexus',22:'Solar Plexus',6:'Solar Plexus',37:'Solar Plexus',
    49:'Solar Plexus',55:'Solar Plexus',30:'Solar Plexus',
    53:'Root',60:'Root',52:'Root',19:'Root',39:'Root',41:'Root',58:'Root',38:'Root',54:'Root'
  };

  // Integration channels are routed through dedicated SVG paths (see original note).
  const INTEGRATION_CHANNELS = {
    "10-20": "Integration10-20",
    "10-34": "Integration10-34",
    "10-57": "Integration10-57",
    "20-34": "Integration20-34",
    "20-57": "Integration20-57",
    "34-57": "Integration34-57"
  };

  // Map free-human-design center names -> SVG group ids in this chart
  const CENTER_ID_MAP = {
    head: 'Head', ajna: 'Ajna', throat: 'Throat', g: 'G', sacral: 'Sacral',
    spleen: 'Spleen', heart: 'Ego', ego: 'Ego',
    solarplexus: 'Solar Plexus', solar_plexus: 'Solar Plexus', root: 'Root'
  };
  function normalizeCenterKey(key){ return String(key).toLowerCase().replace(/[\s_-]/g, ''); }
  const NORMALIZED_CENTER_MAP = {};
  Object.entries(CENTER_ID_MAP).forEach(([key, svgId]) => {
    NORMALIZED_CENTER_MAP[normalizeCenterKey(key)] = svgId;
  });

  // Per-center fill colours (CSS custom properties already defined in the SVG <style>)
  const CENTER_FILL_VARS = {
    'Head': 'var(--center-head)',
    'Ajna': 'var(--center-ajna)',
    'Throat': 'var(--center-throat)',
    'G': 'var(--center-g)',
    'Ego': 'var(--center-ego)',
    'Sacral': 'var(--center-sacral)',
    'Solar Plexus': 'var(--center-solarplexus)',
    'Spleen': 'var(--center-spleen)',
    'Root': 'var(--center-root)'
  };

  function setCenterDefined(el, on, src) {
    if (!el) return;
    el.classList.toggle('defined', !!on);
    el.classList.remove('src-p', 'src-d', 'src-m');
    if (on) {
      el.style.setProperty('--center-fill', CENTER_FILL_VARS[el.id] || 'var(--teal)');
      if (src && CONFIG.showCenterDefinitionSource !== false) {
        el.classList.add(src === 'mixed' ? 'src-m' : src === 'personality' ? 'src-p' : 'src-d');
      }
    } else {
      el.style.removeProperty('--center-fill');
    }
  }

  const PLANET_ORDER = [
    { key: "sun",        symbol: "☉" },
    { key: "earth",      symbol: "⊕" },
    { key: "north_node", symbol: "☊", alt: "northnode" },
    { key: "south_node", symbol: "☋", alt: "southnode" },
    { key: "moon",       symbol: "☽" },
    { key: "mercury",    symbol: "☿" },
    { key: "venus",      symbol: "♀" },
    { key: "mars",       symbol: "♂" },
    { key: "jupiter",    symbol: "♃" },
    { key: "saturn",     symbol: "♄" },
    { key: "uranus",     symbol: "♅" },
    { key: "neptune",    symbol: "♆" },
    { key: "pluto",      symbol: "♇" }
  ];

  // ================= Pure Human Design logic (unit-testable, no DOM) =================
  // Per-gate activation layer.
  function computeGateStates(personalityGates, designGates){
    const p = new Set(personalityGates.map(Number));
    const d = new Set(designGates.map(Number));
    const states = {};
    for (let g = 1; g <= 64; g++) {
      const inp = p.has(g), ind = d.has(g);
      states[g] = inp && ind ? 'both' : inp ? 'personality' : ind ? 'design' : 'inactive';
    }
    return states;
  }

  // Per-channel: independent state per endpoint + derived definition/layer.
  function computeChannelStates(channels, gateStates){
    return channels.map(([a, b]) => {
      const sa = gateStates[a] || 'inactive';
      const sb = gateStates[b] || 'inactive';
      const activeA = sa !== 'inactive', activeB = sb !== 'inactive';
      const defined = activeA && activeB;
      let layer = null;
      if (defined) {
        const layers = new Set();
        [sa, sb].forEach(s =>
          s === 'both' ? layers.add('personality').add('design') : layers.add(s)
        );
        layer = layers.size === 1 ? Array.from(layers)[0] : 'mixed';
      }
      return {
        a, b, key: channelKeyOf(a, b),
        stateA: sa, stateB: sb,
        defined, layer,
        hangingGate: defined ? null : (activeA ? a : activeB ? b : null)
      };
    });
  }

  // Centre definition derived strictly from defined channels (never hard-coded).
  function computeCenterStates(channelStates){
    const layersByCenter = {};
    channelStates.forEach(ch => {
      if (!ch.defined) return;
      [ch.a, ch.b].forEach(g => {
        const c = GATE_CENTER[g];
        if (!c) return;
        (layersByCenter[c] = layersByCenter[c] || new Set()).add(ch.layer);
      });
    });
    const out = {};
    Object.keys(layersByCenter).forEach(c => {
      const s = layersByCenter[c];
      out[c] = s.size === 1 ? Array.from(s)[0] : 'mixed';
    });
    return out;
  }
  window.HDLogic = { computeGateStates, computeChannelStates, computeCenterStates, CHANNELS, GATE_CENTER };

  // ================= SVG geometry registry (built once) =================
  const svgNS = 'http://www.w3.org/2000/svg';
  let geometryReady = false;
  const gateHalves = new Map();      // gate -> Set of that gate's half-channel elements
  const integrationRecs = new Map(); // channelKey -> {originals, clones: Map(gate->[els]), outline}
  const gateCircles = new Map();     // gate -> {x, y} of its number circle

  function dist2(p, q){ const dx = p.x - q.x, dy = p.y - q.y; return dx * dx + dy * dy; }
  function gateCircleCenter(num){
    if (gateCircles.has(num)) return gateCircles.get(num);
    const el = document.getElementById('GateTextBg' + num);
    let c = null;
    if (el) { const bb = el.getBBox(); c = { x: bb.x + bb.width / 2, y: bb.y + bb.height / 2 }; }
    gateCircles.set(num, c);
    return c;
  }
  function splitSubpaths(d){
    return (d.match(/M[^M]*/g) || []).map(s => s.trim()).filter(Boolean);
  }
  function subpathCentroid(d){
    const n = d.match(/-?\d*\.?\d+/g) || [];
    let x = 0, y = 0, m = 0;
    for (let i = 0; i + 1 < n.length; i += 2) { x += +n[i]; y += +n[i + 1]; m++; }
    return m ? { x: x / m, y: y / m } : null;
  }
  function registerHalf(gate, el){
    if (!gateHalves.has(gate)) gateHalves.set(gate, new Set());
    gateHalves.get(gate).add(el);
  }

  function prepareGeometry(){
    if (geometryReady) return;
    geometryReady = true;

    // 1) Regular halves: element pair Gate{g}-a/-b is the strip on gate g's side.
    for (let g = 1; g <= 64; g++) {
      ['-a', '-b'].forEach(sfx => {
        const el = document.getElementById('Gate' + g + sfx);
        if (el) registerHalf(g, el);
      });
      const bg = document.getElementById('GateTextBg' + g);
      if (bg) {
        bg.setAttribute('tabindex', '0');
        bg.setAttribute('role', 'button');
        bg.setAttribute('focusable', 'true');
        bg.setAttribute('data-gate', String(g));
      }
    }

    // 2) Integration channels: split each -a/-b path into subpaths and assign
    //    every subpath to whichever endpoint gate's circle it is closest to, so
    //    each half can be styled from its own gate's activation state.
    Object.entries(INTEGRATION_CHANNELS).forEach(([key, base]) => {
      const [g1, g2] = key.split('-').map(Number);
      const c1 = gateCircleCenter(g1), c2 = gateCircleCenter(g2);
      const rec = {
        originals: [],
        clones: new Map([[g1, []], [g2, []]]),
        outline: document.getElementById(base + '-outline')
      };
      ['-a', '-b'].forEach(sfx => {
        const el = document.getElementById(base + sfx);
        if (!el) return;
        rec.originals.push(el);
        splitSubpaths(el.getAttribute('d') || '').forEach(sub => {
          const cent = subpathCentroid(sub);
          const target = (!c1 || !c2 || !cent) ? g1
            : (dist2(cent, c1) <= dist2(cent, c2) ? g1 : g2);
          const clone = document.createElementNS(svgNS, 'path');
          clone.setAttribute('d', sub);
          clone.setAttribute('class', el.getAttribute('class') || 'ga');
          clone.setAttribute('data-integration-clone', '1');
          clone.setAttribute('data-channel-key', key);
          clone.style.display = 'none';
          el.parentNode.insertBefore(clone, el);
          rec.clones.get(target).push(clone);
          registerHalf(target, clone);
        });
      });
      integrationRecs.set(key, rec);
    });

    wireGateInteractions();
    wireRowInteractions();

    const tog = document.getElementById('modeToggle');
    if (tog) tog.addEventListener('click', () => {
      CONFIG.mode = CONFIG.mode === 'detailed' ? 'simplified' : 'detailed';
      if (lastChart) render(lastChart);
    });
    updateModeToggle();
  }

  function updateModeToggle(){
    const tog = document.getElementById('modeToggle');
    if (!tog) return;
    tog.hidden = !CONFIG.showModeToggle;
    tog.textContent = CONFIG.mode === 'detailed' ? 'Mode: Detailed' : 'Mode: Simplified';
    tog.setAttribute('aria-pressed', CONFIG.mode === 'detailed' ? 'true' : 'false');
  }

  // ================= Shared helpers =================
  const DETAIL_HALF_CLASSES = ['half-personality', 'half-design', 'half-both', 'half-open'];

  function clearDetailStyles(){
    document.querySelectorAll('.ga, .gb').forEach(el =>
      el.classList.remove(...DETAIL_HALF_CLASSES, 'hl'));
    document.querySelectorAll('[data-integration-clone]').forEach(el => {
      el.style.display = 'none';
      el.classList.remove(...DETAIL_HALF_CLASSES, 'hl');
    });
    document.querySelectorAll('.gtbg').forEach(el =>
      el.classList.remove('gate-p', 'gate-d', 'gate-both', 'hl'));
    document.querySelectorAll('text[id^="GateText"]').forEach(el =>
      el.classList.remove('gate-p', 'gate-d', 'gate-both', 'hl'));
    Object.values(CENTER_ID_MAP).forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.classList.remove('defined', 'src-p', 'src-d', 'src-m');
        el.style.removeProperty('--center-fill');
      }
    });
    document.querySelectorAll('.row[data-gate]').forEach(r => r.classList.remove('hl'));
    hideTooltip();
  }

  function findActivation(acts, key, altKey){
    if (!Array.isArray(acts)) return null;
    return acts.find((a) => {
      const b = String(a.body || "").toLowerCase().replace(/[\s-]/g, "_");
      return b === key || (altKey && b === altKey);
    }) || null;
  }
  function activationSummary(chart){
    const p = (chart.activations && chart.activations.personality) || [];
    const d = (chart.activations && chart.activations.design) || [];
    return {
      pActs: p, dActs: d,
      pGates: p.map(a => Number(a.gate)).filter(n => !Number.isNaN(n)),
      dGates: d.map(a => Number(a.gate)).filter(n => !Number.isNaN(n))
    };
  }
  function planetName(body){
    const b = String(body || "").toLowerCase().replace(/[\s-]/g, "_");
    const hit = PLANET_ORDER.find(p => p.key === b || p.alt === b);
    const label = b.replace(/_/g, " ").replace(/\b\w/g, ch => ch.toUpperCase());
    return hit ? hit.symbol + " " + label : label;
  }
  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  // ---------- Side activation columns (kept layout; added data + interactivity) ----------
  // ---------- Variables (Color / Tone arrows at top of bodygraph) ----------
  function arrowGlyph(direction) {
    if (direction === "left" || direction === "L") return "\u2190";  // ←
    if (direction === "right" || direction === "R") return "\u2192"; // →
    return "";
  }

  function bodyKey(body) {
    return String(body || "").toLowerCase().replace(/[\s_-]+/g, "_");
  }

  function findAct(list, names) {
    if (!Array.isArray(list)) return null;
    const set = new Set(names.map(bodyKey));
    return list.find(a => set.has(bodyKey(a.body || a.name))) || null;
  }

  function toneDirection(tone) {
    const t = Number(tone);
    if (!Number.isFinite(t) || t < 1 || t > 6) return null;
    return t <= 3 ? "left" : "right";
  }

  // Build variables from chart.variables OR fall back to activations (Sun + Nodes)
  function resolveVariables(chart) {
    const v = (chart && chart.variables) || {};
    const acts = (chart && chart.activations) || {};
    const design = acts.design || [];
    const personality = acts.personality || [];

    function pick(existing, act) {
      const color = existing?.color ?? act?.color ?? null;
      const tone  = existing?.tone  ?? act?.tone  ?? null;
      const base  = existing?.base  ?? act?.base  ?? null;
      const direction = existing?.direction || toneDirection(tone);
      return { color, tone, base, direction };
    }

    const dSun  = findAct(design, ["sun"]);
    const dNode = findAct(design, ["south_node", "south node", "north_node", "north node"]);
    const pSun  = findAct(personality, ["sun"]);
    const pNode = findAct(personality, ["south_node", "south node", "north_node", "north node"]);

    return {
      determination: pick(v.determination, dSun),
      environment:   pick(v.environment,   dNode),
      motivation:    pick(v.motivation,    pSun),
      perspective:   pick(v.perspective,   pNode)
    };
  }

  function renderVariables(chart) {
    const bar = document.getElementById("variables-bar");
    if (!bar) return;

    const resolved = resolveVariables(chart);
    // Show arrows whenever we have a direction (from tone), even without color numbers
    const hasAny = ["determination", "environment", "motivation", "perspective"].some(k => {
      const d = resolved[k];
      return d && (d.direction || d.tone != null);
    });

    if (!hasAny) {
      bar.classList.add("empty");
      ["var-determination", "var-environment", "var-motivation", "var-perspective"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = "";
      });
      return;
    }

    bar.classList.remove("empty");

    const slots = [
      { id: "var-determination", data: resolved.determination },
      { id: "var-environment",   data: resolved.environment },
      { id: "var-motivation",    data: resolved.motivation },
      { id: "var-perspective",   data: resolved.perspective }
    ];

    slots.forEach(({ id, data }) => {
      const el = document.getElementById(id);
      if (!el) return;
      const dir = data && (data.direction || (data.tone != null ? (Number(data.tone) <= 3 ? "left" : "right") : null));
      el.textContent = arrowGlyph(dir) || "";
    });
  }

  function renderSideColumns(chart){
    const designList = document.getElementById("design-list");
    const personalityList = document.getElementById("personality-list");
    if (!designList || !personalityList) return;
    designList.innerHTML = "";
    personalityList.innerHTML = "";

    const { pActs, dActs } = activationSummary(chart);
    const pSet = new Set(pActs.map(a => Number(a.gate)));
    const dSet = new Set(dActs.map(a => Number(a.gate)));

    PLANET_ORDER.forEach((p) => {
      [
        { side: "design",      list: designList,      acts: dActs, other: pSet },
        { side: "personality", list: personalityList, acts: pActs, other: dSet }
      ].forEach(({ side, list, acts, other }) => {
        const found = findActivation(acts, p.key, p.alt);
        const val = (!found || found.gate == null) ? "–" : `${found.gate}.${found.line ?? 0}`;
        const row = document.createElement("div");
        row.className = "row";
        row.dataset.side = side;
        if (found && found.gate != null) {
          row.dataset.gate = String(found.gate);
          row.tabIndex = 0;
        }
        row.innerHTML = `<span class="planet">${p.symbol}</span> ${val}`;
        list.appendChild(row);
      });
    });
  }

  // ================= Simplified mode (original rendering, preserved) =================
  function getGateSourceSets(chart){
    const toSet = (acts) =>
      new Set((acts || []).map((a) => Number(a.gate)).filter((n) => !Number.isNaN(n)));
    return {
      designGates: toSet(chart.activations && chart.activations.design),
      personalityGates: toSet(chart.activations && chart.activations.personality)
    };
  }
  function classifyChannel(g1, g2, gateSets){
    const anyDesign = gateSets.designGates.has(g1) || gateSets.designGates.has(g2);
    const anyPersonality = gateSets.personalityGates.has(g1) || gateSets.personalityGates.has(g2);
    if (anyDesign && anyPersonality) return 'both';
    if (anyPersonality) return 'personality';
    if (anyDesign) return 'design';
    return null;
  }
  function integrationBaseFor(g1, g2){
    const a = Number(g1), b = Number(g2);
    if (!a || !b || a === b) return null;
    const key = channelKeyOf(a, b);
    return INTEGRATION_CHANNELS[key] || null;
  }
  function activateIntegrationChannel(g1, g2, stateClass){
    const base = integrationBaseFor(g1, g2);
    if (!base || !stateClass) return;
    ["-a", "-b", "-outline"].forEach((suffix) => {
      const el = document.getElementById(base + suffix);
      if (el) { el.classList.add(stateClass); el.style.display = "inline"; }
    });
  }
  function resetIntegrationChannels(){
    Object.values(INTEGRATION_CHANNELS).forEach((base) => {
      ["-a", "-b", "-outline"].forEach((suffix) => {
        const el = document.getElementById(base + suffix);
        if (el) {
          el.classList.remove("channel-personality", "channel-design", "channel-both");
          el.style.display = "none";
        }
      });
    });
  }

  function renderSimplifiedBodygraph(chart){
    clearDetailStyles();
    const svg = document.getElementById('chart');
    svg.classList.toggle('hc', !!CONFIG.highContrastMode);
    renderSideColumns(chart);

    Object.values(CENTER_ID_MAP).forEach((svgId) => {
      setCenterDefined(document.getElementById(svgId), false);
    });
    document.querySelectorAll('.gtbg').forEach((el) => el.classList.remove('gate-active'));
    document.querySelectorAll('text[id^="GateText"]').forEach((el) => el.classList.remove('gate-active'));
    document.querySelectorAll('.channel-personality, .channel-design, .channel-both').forEach((el) => {
      el.classList.remove('channel-personality', 'channel-design', 'channel-both');
    });
    resetIntegrationChannels();

    const gateSets = getGateSourceSets(chart);

    // Centres: binary defined/undefined + per-center brand colour
    (chart.definedCenters || []).map(normalizeCenterKey).forEach((key) => {
      const svgId = NORMALIZED_CENTER_MAP[key];
      if (!svgId) { console.warn('Bodygraph: unrecognized center key ->', key); return; }
      setCenterDefined(document.getElementById(svgId), true);
    });

    // Channels: single colour state per whole channel
    const gatesInDefinedChannels = new Set();
    (chart.definedChannels || []).forEach((channel) => {
      if (!channel || !Array.isArray(channel.gates)) return;
      const [g1, g2] = channel.gates.map(Number);
      if (!g1 || !g2) return;
      const state = classifyChannel(g1, g2, gateSets);
      if (!state) {
        console.warn(`Bodygraph: defined channel ${g1}-${g2} matched no gate activation — leaving inactive style.`);
        return;
      }
      const stateClass =
        state === 'both' ? 'channel-both' : state === 'design' ? 'channel-design' : 'channel-personality';
      activateIntegrationChannel(g1, g2, stateClass);
      let matchedCount = 0;
      [g1, g2].forEach((g) => {
        gatesInDefinedChannels.add(g);
        const matches = document.querySelectorAll(`[id^="Gate${g}-"]`);
        matchedCount += matches.length;
        matches.forEach((p) => {
          if (p.classList.contains('ga') || p.classList.contains('gb')) p.classList.add(stateClass);
        });
      });
      if (matchedCount === 0) {
        console.warn(`Bodygraph: channel "${channel.key || (g1 + '-' + g2)}" found NO matching SVG elements.`);
      }
    });

    gatesInDefinedChannels.forEach((num) => {
      const bg = document.getElementById(`GateTextBg${num}`);
      const label = document.getElementById(`GateText${num}`);
      if (bg) bg.classList.add('gate-active');
      if (label) label.classList.add('gate-active');
    });
  }

  // ================= Detailed mode =================
  function renderDetailedBodygraph(chart, pActs, dActs, gateStates, channelStates){
    clearDetailStyles();
    const svg = document.getElementById('chart');
    svg.classList.toggle('hc', !!CONFIG.highContrastMode);
    renderSideColumns(chart);

    // Integration originals/outlines hidden; per-gate clones take over.
    integrationRecs.forEach(rec => {
      rec.originals.forEach(el => el.style.display = 'none');
      if (rec.outline) rec.outline.style.display = 'none';
    });

    const layerColours = CONFIG.showChannelLayerColours !== false;
    const showOpen = CONFIG.showHangingGates !== false;

    // ---- CHANNELS: style each half from its own gate's activation state ----
    channelStates.forEach(ch => {
      const rec = integrationRecs.get(ch.key);
      const anyActive = ch.stateA !== 'inactive' || ch.stateB !== 'inactive';
      if (rec && anyActive && rec.outline) rec.outline.style.display = 'inline';

      [{ g: ch.a, s: ch.stateA }, { g: ch.b, s: ch.stateB }].forEach(({ g, s }) => {
        let cls = null;
        if (s === 'inactive') {
          cls = showOpen ? 'half-open' : null;           // hanging-gate open half
        } else if (!layerColours) {
          cls = 'half-design';                            // brand single-colour fallback
        } else {
          cls = s === 'personality' ? 'half-personality'
              : s === 'design'      ? 'half-design'
              :                       'half-both';        // gate active on both layers
        }
        const els = gateHalves.get(g);
        if (!els) return;
        els.forEach(el => {
          if (el.dataset.integrationClone) {
            if (el.dataset.channelKey !== ch.key || !anyActive) return; // stays hidden
            el.style.display = 'inline';
          }
          if (cls) el.classList.add(cls);
        });
      });
    });

    // ---- GATES: per-layer activation styling ----
    for (let g = 1; g <= 64; g++) {
      const s = gateStates[g];
      const cls = s === 'personality' ? 'gate-p'
                : s === 'design'      ? 'gate-d'
                : s === 'both'        ? 'gate-both'
                :                       null;
      if (cls) {
        const bg = document.getElementById('GateTextBg' + g);
        const label = document.getElementById('GateText' + g);
        if (bg) bg.classList.add(cls);
        if (label) label.classList.add(cls);
      }
    }

    // ---- CENTRES: derived from defined channels + per-center brand colour + optional definition-source cue ----
    const centerStates = computeCenterStates(channelStates);
    Object.entries(centerStates).forEach(([center, src]) => {
      const svgId = NORMALIZED_CENTER_MAP[normalizeCenterKey(center)];
      const el = svgId && document.getElementById(svgId);
      if (!el) return;
      setCenterDefined(el, true, src);
    });
  }

  // ================= Interactions: tooltip, hover, focus, highlighting =================
  const tooltip = document.getElementById('hd-tooltip');
  function hideTooltip(){ if (tooltip) tooltip.hidden = true; }
  function showTooltip(html, x, y){
    if (!tooltip) return;
    tooltip.innerHTML = html;
    tooltip.hidden = false;
    const r = tooltip.getBoundingClientRect();
    let left = Math.min(Math.max(8, x - r.width / 2), window.innerWidth - r.width - 8);
    let top = y - r.height - 12;
    if (top < 8) top = y + 18;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function layerBadge(state){
    if (state === 'personality') return '<span class="tt-layer p">P</span>';
    if (state === 'design')      return '<span class="tt-layer d">D</span>';
    if (state === 'both')        return '<span class="tt-layer b">P+D</span>';
    return '<span class="tt-layer o">&ndash;</span>';
  }
  function activationLine(acts, state, g){
    const hits = acts.filter(a => Number(a.gate) === g);
    if (!hits.length) return '';
    return '<div>' + layerBadge(state) + ' ' +
      hits.map(a => `${planetName(a.body)} ${a.gate}.${a.line ?? 0}`).join(', ') + '</div>';
  }
  function gateTooltipHTML(g){
    const chs = (window.__lastChannelStates || []).filter(c => c.a === g || c.b === g);
    const chHtml = chs.map(c => {
      const status = c.defined
        ? (c.layer === 'mixed' ? 'Mixed-defined' : capitalize(c.layer) + '-defined')
        : c.hangingGate ? 'Hanging gate' : 'Open';
      return `<div class="tt-meta">Channel ${c.a}&ndash;${c.b}: ${layerBadge(c.stateA)}${layerBadge(c.stateB)} ${status}</div>`;
    }).join('');
    return `<div class="tt-title">Gate ${g} &middot; ${GATE_CENTER[g] || ''} centre</div>`
      + activationLine(window.__lastPActs || [], 'personality', g)
      + activationLine(window.__lastDActs || [], 'design', g)
      + chHtml;
  }

  function setGateHighlight(g, on){
    const bg = document.getElementById('GateTextBg' + g);
    const label = document.getElementById('GateText' + g);
    if (bg) bg.classList.toggle('hl', on);
    if (label) label.classList.toggle('hl', on);
    const els = gateHalves.get(g);
    if (els) els.forEach(el => el.classList.toggle('hl', on));
    document.querySelectorAll(`.row[data-gate="${g}"]`).forEach(r => r.classList.toggle('hl', on));
  }
  function setChannelHighlight(ch, on){
    setGateHighlight(ch.a, on);
    setGateHighlight(ch.b, on);
  }
  function highlightGateWithChannels(g, on){
    setGateHighlight(g, on);
    (window.__lastChannelStates || [])
      .filter(c => c.a === g || c.b === g)
      .forEach(c => setChannelHighlight(c, on));
  }

  function wireGateInteractions(){
    for (let g = 1; g <= 64; g++) {
      const bg = document.getElementById('GateTextBg' + g);
      if (!bg) continue;
      const enter = () => {
        highlightGateWithChannels(g, true);
        const r = bg.getBoundingClientRect();
        showTooltip(gateTooltipHTML(g), r.left + r.width / 2, r.top);
      };
      const leave = () => { highlightGateWithChannels(g, false); hideTooltip(); };
      bg.addEventListener('mouseenter', enter);
      bg.addEventListener('mouseleave', leave);
      bg.addEventListener('focus', enter);
      bg.addEventListener('blur', leave);
    }
  }
  function wireRowInteractions(){
    const handler = (on) => (ev) => {
      const row = ev.target.closest && ev.target.closest('.row[data-gate]');
      if (!row) return;
      const g = Number(row.dataset.gate);
      if (on) highlightGateWithChannels(g, true);
      else { highlightGateWithChannels(g, false); hideTooltip(); }
    };
    ['design-list', 'personality-list'].forEach(id => {
      const list = document.getElementById(id);
      if (!list) return;
      list.addEventListener('mouseover', handler(true));
      list.addEventListener('mouseout', handler(false));
      list.addEventListener('focusin', handler(true));
      list.addEventListener('focusout', handler(false));
    });
  }

  // ================= Render dispatch =================
  function setGateAriaLabels(gateStates, pActs, dActs){
    for (let g = 1; g <= 64; g++) {
      const bg = document.getElementById('GateTextBg' + g);
      if (!bg) continue;
      const parts = [];
      const pa = pActs.find(a => Number(a.gate) === g);
      const da = dActs.find(a => Number(a.gate) === g);
      if (pa) parts.push('Personality ' + planetName(pa.body));
      if (da) parts.push('Design ' + planetName(da.body));
      bg.setAttribute('aria-label',
        `Gate ${g}, ${GATE_CENTER[g] || 'unknown'} centre` +
        (parts.length ? `, activated by ${parts.join(' and ')}` : ', inactive'));
    }
  }

  function render(chart){
    prepareGeometry();
    lastChart = chart;
    const { pActs, dActs, pGates, dGates } = activationSummary(chart);
    window.__lastPActs = pActs;
    window.__lastDActs = dActs;
    window.__lastGateStates = computeGateStates(pGates, dGates);
    window.__lastChannelStates = computeChannelStates(CHANNELS, window.__lastGateStates);

    const detailed = CONFIG.mode === 'detailed' && CONFIG.showDetailedActivations !== false;
    if (detailed) renderDetailedBodygraph(chart, pActs, dActs, window.__lastGateStates, window.__lastChannelStates);
    else renderSimplifiedBodygraph(chart);

    renderVariables(chart);
    setGateAriaLabels(window.__lastGateStates, pActs, dActs);
    updateModeToggle();
  }

  // ================= Sample test fixture =================
  // Coverage:
  //  - Personality-only defined channels: 16-48, 1-8, 25-51, 63-4
  //  - Design-only defined channels:     43-23, 13-33, 21-45, 40-37
  //  - Mixed-defined channels:           10-20, 34-57, 20-57, 10-34, 10-57, 20-34
  //  - Personality hanging gate:         26 (44 open); 64-47 fully open
  //  - Design hanging gate:              61 (24 open)
  //  - Gates active in both datasets:    10, 20, 34, 57
  //  - Fully open channels:              64-47, 17-62, 11-56, 7-31, 2-14, 35-36, 54-32 ...
  //  - Centre definition sources:        Head = personality, Solar Plexus = design,
  //                                      Ajna/Throat/G/Sacral/Spleen/Ego = mixed,
  //                                      Root = undefined.
  const SAMPLE_TEST_CHART = {
    activations: {
      design: [
        { body: 'sun',        gate: 34, line: 3 },
        { body: 'earth',      gate: 20, line: 1 },
        { body: 'north_node', gate: 57, line: 2 },
        { body: 'south_node', gate: 10, line: 5 },
        { body: 'moon',       gate: 43, line: 4 },
        { body: 'mercury',    gate: 23, line: 6 },
        { body: 'venus',      gate: 40, line: 1 },
        { body: 'mars',       gate: 37, line: 3 },
        { body: 'jupiter',    gate: 21, line: 2 },
        { body: 'saturn',     gate: 45, line: 4 },
        { body: 'uranus',     gate: 13, line: 5 },
        { body: 'neptune',    gate: 33, line: 6 },
        { body: 'pluto',      gate: 61, line: 1 }
      ],
      personality: [
        { body: 'sun',        gate: 10, line: 5 },
        { body: 'earth',      gate: 20, line: 1 },
        { body: 'north_node', gate: 34, line: 3 },
        { body: 'south_node', gate: 57, line: 2 },
        { body: 'moon',       gate: 16, line: 4 },
        { body: 'mercury',    gate: 48, line: 5 },
        { body: 'venus',      gate: 25, line: 3 },
        { body: 'mars',       gate: 51, line: 2 },
        { body: 'jupiter',    gate: 26, line: 1 },
        { body: 'saturn',     gate: 8,  line: 4 },
        { body: 'uranus',     gate: 1,  line: 2 },
        { body: 'neptune',    gate: 4,  line: 6 },
        { body: 'pluto',      gate: 63, line: 3 }
      ]
    }
  };

  window.addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.type === 'renderBodygraph' && data.chart) {
      stopReadyPing();
      if (data.config) Object.assign(CONFIG, data.config);
      render(data.chart);
    } else if (data.type === 'setBodygraphConfig') {
      if (data.config) Object.assign(CONFIG, data.config);
      if (lastChart) render(lastChart);
    } else if (data.type === 'renderBodygraphTest') {
      stopReadyPing();
      render(SAMPLE_TEST_CHART);
    }
  });

  // ================= Handshake with the Wix page =================
  // Tell the page we're ready until it answers with a chart: every 100 ms for
  // the first 2 s (so the drawing appears as soon as the page code is up),
  // then every 500 ms, giving up after 60 s. The listener above is already
  // attached, so no reply can be missed. The sample chart only renders when
  // this file is opened on its own, never inside the live site.
  let readyPingTimer = null;
  function stopReadyPing() {
    clearTimeout(readyPingTimer);
    readyPingTimer = null;
  }
  function pingParent(startedAt) {
    window.parent.postMessage({ type: 'bodygraphReady' }, '*');
    const elapsed = Date.now() - startedAt;
    if (elapsed < 60000) readyPingTimer = setTimeout(() => pingParent(startedAt), elapsed < 2000 ? 100 : 500);
  }
  if (window.parent !== window) pingParent(Date.now());
  else render(SAMPLE_TEST_CHART);
</script>
